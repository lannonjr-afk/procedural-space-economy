[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-space-economy"
version = "0.1.0"
description = "Deterministic procedural terrain, market, and networking reference models"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
